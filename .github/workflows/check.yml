# Runs tests/check.sh, the repo gate, on every PR and every push to main.
# check.sh prints one line per case: "ok", "FAIL" or "skip -- <reason>".
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Ubuntu 24.04, the newest hosted runner, ships TeX Live 2023, whose
    # fvextra has no bgcolor key, so every listing in the house style fails
    # to compile there. The job runs in Ubuntu 26.04, which carries TeX Live
    # 2025 like the machines the documents are built on.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-26.04-v1

      # git goes in before the checkouts so they are real clones, which the
      # submodule fetch below needs.
      - name: Install git, TeX, poppler and rsvg-convert
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates python3 zip \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures lmodern poppler-utils librsvg2-bin fontconfig
          git config --global --add safe.directory '*'

      # This repo and lesson-builder sit side by side, so voice-drift.sh
      # finds ../lesson-builder the way it does on a dev machine.
      - uses: actions/checkout@v4
        with:
          path: pdf-material-builder
      - uses: actions/checkout@v4
        with:
          repository: ihsan-sa/lesson-builder
          path: lesson-builder

      # diagram-maker is a private repo and the workflow carries no secret to
      # read it, so this fetch fails today and check 13 (hsdiagram) skips.
      # It starts running on its own once the submodule can be read.
      - name: Fetch the diagram-maker submodule
        working-directory: pdf-material-builder
        run: |
          if git -c credential.helper= -c core.askPass=true submodule update --init diagram-maker; then
            echo "diagram-maker checked out"
          else
            echo "::notice::diagram-maker could not be fetched, so the hsdiagram check will skip"
          fi

      - name: Run tests/check.sh
        working-directory: pdf-material-builder
        run: tests/check.sh
